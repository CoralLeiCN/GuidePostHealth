name: guidepost-health

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0-unprivileged
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT_INIT_FILE_PATH: /qdrant/init/.qdrant-initialized
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    read_only: true
    tmpfs:
      - /qdrant/init:size=1m,noexec,nosuid,uid=1000,gid=1000,mode=0700
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.50
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 128
    ulimits:
      nofile:
        soft: 10000
        hard: 10000
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "200 OK" <&3'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qdrant_storage:
  qdrant_snapshots:
